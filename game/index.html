<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Fox — Steal the Moon-Pearl</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 700px at 50% 30%, #16263f 0%, #0a1322 55%, #050a14 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: #dbeafe;
    }
    main { text-align: center; padding: 18px 10px 22px; }
    canvas {
      display: block;
      width: min(96vw, 960px);
      height: auto;
      aspect-ratio: 3 / 2;
      background: #071018;
      border: 1px solid #2b4a67;
      border-radius: 10px;
      box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 6px rgba(125,211,252,.05);
    }
    p { margin: 12px 0 0; font-size: 13px; letter-spacing: .04em; color: #93b4d6; }
    b { color: #fcd34d; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <canvas id="game" width="960" height="640" aria-label="Lantern Fox stealth game"></canvas>
    <p><b>Lantern Fox</b> &nbsp;·&nbsp; WASD / Arrows to move &nbsp;·&nbsp; Shift to prowl &nbsp;·&nbsp; R to restart &nbsp;·&nbsp; Click menus to begin</p>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
